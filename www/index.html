<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semangat Tugas · Pengingat Kuliah</title>
<style>
:root{--bg:#f3f2ff;--card:#fff;--tx:#1d1b3a;--mut:#6f6c90;--bd:#e6e4f7;--ac:#6d5efc;--ac2:#ece9ff;--g1:#6d5efc;--g2:#ff6fb1;--red:#e63a5b;--amb:#d98a00;--grn:#16a06a;--sh:0 10px 28px rgba(80,60,200,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13122a;--card:#1d1b3c;--tx:#f0eeff;--mut:#a09dc6;--bd:#2f2d58;--ac:#9a8dff;--ac2:#2a2760;--red:#ff7791;--amb:#ffb938;--grn:#4fdc9f;--sh:0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#13122a;--card:#1d1b3c;--tx:#f0eeff;--mut:#a09dc6;--bd:#2f2d58;--ac:#9a8dff;--ac2:#2a2760;--red:#ff7791;--amb:#ffb938;--grn:#4fdc9f;--sh:0 10px 28px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:780px;margin:0 auto;padding:14px 16px 110px;position:relative}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:24px;padding:22px 20px 20px;box-shadow:var(--sh);position:relative;overflow:hidden;margin-bottom:14px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero:before{right:-30px;top:-50px;width:170px;height:170px}
.hero:after{right:60px;bottom:-70px;width:140px;height:140px}
.hero h1{margin:0;font-size:23px;padding-right:100px;position:relative;z-index:1}
.hero p{margin:5px 0 0;opacity:.96;position:relative;z-index:1}
.tb{position:absolute;top:14px;z-index:2;background:rgba(255,255,255,.24);border:0;color:#fff;border-radius:12px;width:36px;height:36px;padding:0;cursor:pointer;font-size:16px}
.menu{display:none;position:absolute;top:70px;right:16px;width:min(340px,calc(100% - 32px));z-index:7;margin:0}
.menu.open{display:block}
.pg{display:none}.pg.on{display:block;animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
h2{font-size:16px;margin:0 0 10px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.sec h2{margin:0}
.ringbox{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--ac2)}
.ring .fg{transition:stroke-dashoffset .7s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.ch{background:var(--ac2);border-radius:14px;padding:8px 10px}
.ch b{font-size:19px;display:block;line-height:1.2}.ch span{font-size:12px;color:var(--mut)}
.pet{display:flex;gap:14px;align-items:center}
.pv{width:120px;height:120px;flex:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pv svg{width:100%;height:100%;animation:bob 3s ease-in-out infinite;overflow:visible}
.pv.sad svg{animation-duration:5s}
.pv.jump svg{animation:jump .5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes jump{0%{transform:translateY(0)}40%{transform:translateY(-22px) scale(1.06)}100%{transform:translateY(0)}}
.bub{background:var(--ac2);border-radius:16px 16px 16px 4px;padding:9px 12px;font-weight:600;font-size:14px;margin-bottom:8px}
.xpb{height:8px;border-radius:9px;background:var(--ac2);overflow:hidden}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .6s}
.q{display:flex;gap:12px;align-items:flex-start}
.q .em{font-size:32px;line-height:1}
.q q{display:block;font-weight:600;quotes:none}
.q small{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 150px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:12px;cursor:pointer}
button.p{background:linear-gradient(135deg,var(--g1),var(--g2));border:0;color:#fff;font-weight:600;padding:12px 16px}
button:active{transform:scale(.97)}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pre button{padding:5px 11px;font-size:13px;background:var(--ac2);border:0;color:var(--ac)}
.it{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.it.late{border-left-color:var(--red)}.it.soon{border-left-color:var(--amb)}.it.done{border-left-color:var(--grn)}
.it input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--ac)}
.t{font-weight:700}
.m{font-size:13px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:1px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);margin-right:4px}
.c-late{color:var(--red);font-weight:600}.c-soon{color:var(--amb);font-weight:600}.c-ok{color:var(--grn);font-weight:600}
.x{margin-left:auto;flex:none;padding:2px 9px;color:var(--mut);border:0;background:none}
.emp{text-align:center;color:var(--mut);padding:26px 10px}
.emp b{display:block;font-size:36px}
.emp button{margin-top:10px}
.wk{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:6px}
.wk div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.wk i{display:block;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--g2),var(--g1));min-height:5px;margin-bottom:4px}
.wk i.z{background:var(--ac2)}
.wk b{font-size:12px;color:var(--tx)}
.td{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--sh)}
.td input{width:22px;height:22px;flex:none;accent-color:var(--ac)}
.td span{flex:1;word-break:break-word}
.td.dn span{text-decoration:line-through;color:var(--mut)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.nav div{max-width:780px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 4px;font-size:12px;border-radius:14px}
.nav button span{font-size:20px;line-height:1.2}
.nav button.on{background:var(--ac2);color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;display:none;max-width:90%;z-index:9;text-align:center}
.pop{position:fixed;pointer-events:none;font-size:26px;z-index:8;animation:up 1.2s ease-out forwards}
@keyframes up{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-160px) scale(1.3);opacity:0}}
</style>
</head>
<body>
<div class="w">
  <div class="hero">
    <button class="tb" id="th" title="Ganti tema" style="right:58px">🌓</button>
    <button class="tb" id="mn" title="Pengaturan" aria-label="Pengaturan" style="right:14px;font-size:20px">⋮</button>
    <h1 id="gr">Halo!</h1>
    <p id="gs">Yuk selesaikan satu tugas hari ini.</p>
  </div>

  <div class="card menu" id="menu">
    <h2>Pengaturan</h2>
    <div class="row" style="align-items:end">
      <div style="flex:3 1 200px"><label>Namamu</label><input id="nm" placeholder="mis. Ismail" maxlength="30"></div>
      <div style="flex:3 1 200px"><label>Nama peliharaan</label><input id="pn" placeholder="mis. Mochi" maxlength="20"></div>
      <div><button id="ns" style="width:100%">Simpan nama</button></div>
    </div>
    <div class="row" style="align-items:end;margin-top:10px">
      <div style="flex:3 1 200px"><label>Alamat LMS kampusmu</label><input id="lu" placeholder="https://lms.kampusmu.ac.id"></div>
      <div style="display:flex;gap:6px"><button id="ls">Simpan</button><button class="p" id="lo" style="padding:9px 14px">Buka LMS ↗</button></div>
    </div>
    <div style="margin-top:10px"><button id="nt">🔔 Aktifkan notifikasi</button></div>
  </div>

  <section class="pg on" id="p-beranda">
    <div class="card">
      <h2>Progres tugasmu</h2>
      <div class="ringbox">
        <div class="ring">
          <svg viewBox="0 0 100 100"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></linearGradient></defs>
          <circle class="bg" cx="50" cy="50" r="44" fill="none" stroke-width="10"/>
          <circle class="fg" id="rg" cx="50" cy="50" r="44" fill="none" stroke="url(#gg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="276.46"/></svg>
          <b id="rp">0%</b>
        </div>
        <div style="flex:1">
          <div class="m" id="pt" style="margin-bottom:8px"></div>
          <div class="chips">
            <div class="ch"><b id="s1">0</b><span>Aktif</span></div>
            <div class="ch"><b id="s2">0</b><span>Selesai</span></div>
            <div class="ch"><b id="s4">0</b><span>Terlambat</span></div>
            <div class="ch"><b id="s3">0🔥</b><span>Hari beruntun</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class='card'>
      <div class='pet'>
        <div class='pv' id='pv' title='Elus aku!'></div>
        <div style='flex:1;min-width:0'>
          <div class='bub' id='pb'></div>
          <div class='m'><b id='pn2' style='color:var(--tx)'></b> · <span id='pl'></span></div>
          <div class='xpb' style='margin:6px 0 3px'><i id='px'></i></div>
          <div class='m' id='pxt'></div>
          <div style='display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap'><button class='p' id='fd' style='padding:9px 14px'>🍎 Kasih makan</button><span class='m' id='fs'></span></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="q"><div class="em" id="qe">✨</div><div><q id="qt"></q><small id="qa"></small></div></div>
      <div style="margin-top:10px"><button id="qn">Semangat baru ✨</button></div>
    </div>
    <div class="sec"><h2>Tugas aktif</h2><span class="m" id="ac"></span></div>
    <div id="list"></div>
  </section>

  <section class="pg" id="p-tambah">
    <div class="card">
      <h2>Tambah pengingat</h2>
      <div class="row">
        <div style="flex:2 1 220px"><label>Judul tugas</label><input id="ti" placeholder="mis. Laporan Praktikum Modul 4"></div>
        <div><label>Mata kuliah</label><input id="co" placeholder="mis. Cloud Computing"></div>
      </div>
      <div style="margin-top:10px"><label>Deadline</label><input id="du" type="datetime-local">
        <div class="pre"><button data-p="0">Hari ini</button><button data-p="1">Besok</button><button data-p="3">3 hari lagi</button><button data-p="7">Minggu depan</button></div></div>
      <div class="row" style="margin-top:10px">
        <div><label>Ingatkan sebelum</label><select id="re"><option value="0">Tepat waktu</option><option value="30">30 menit</option><option value="60">1 jam</option><option value="180">3 jam</option><option value="1440" selected>1 hari</option><option value="4320">3 hari</option></select></div>
        <div><label>Prioritas</label><select id="pr"><option value="1">Rendah</option><option value="2" selected>Sedang</option><option value="3">Tinggi</option></select></div>
      </div>
      <div style="margin-top:10px"><label>Catatan (opsional)</label><input id="no" placeholder="link, instruksi, dll."></div>
      <div style="margin-top:14px"><button class="p" id="add" style="width:100%">+ Tambah pengingat</button></div>
    </div>
  </section>

  <section class='pg' id='p-todo'>
    <div class='card'>
      <h2>To-Do hari ini</h2>
      <div style='display:flex;gap:8px'><input id='tdi' placeholder='Tulis hal kecil yang mau dikerjakan...' maxlength='80'><button class='p' id='tda' style='flex:none;padding:10px 18px'>+</button></div>
      <div class='xpb' style='margin:14px 0 4px'><i id='tdp'></i></div>
      <div class='m' id='tdt'></div>
    </div>
    <div class='sec'><h2>Daftar</h2><button id='tdc' style='padding:5px 11px;font-size:13px'>Hapus yang selesai</button></div>
    <div id='tdl'></div>
  </section>

  <section class="pg" id="p-riwayat">
    <div class="card">
      <h2>Aktivitas 7 hari terakhir</h2>
      <div class="wk" id="wk"></div>
      <div class="m" id="rs" style="margin-top:6px"></div>
    </div>
    <div class="sec"><h2>Tugas selesai</h2><button id="cl" style="padding:5px 11px;font-size:13px">Hapus riwayat</button></div>
    <div id="hist"></div>
  </section>
</div>

<div class="nav"><div id="nav">
  <button data-g="beranda" class="on"><span>🏠</span>Beranda</button>
  <button data-g="tambah"><span>➕</span>Tambah</button>
  <button data-g="todo"><span>✅</span>To-Do</button>
  <button data-g="riwayat"><span>🕘</span>Riwayat</button>
</div></div>
<div id="toast"></div>

<script>
(function(){
var KEY="semangat-tugas-v2",S={items:[],log:{},lms:"",name:"Ismail",pet:"Mochi",xp:0,todos:[],food:2},page="beranda";
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"{}");S.items=d.items||[];S.log=d.log||{};S.lms=d.lms||"";S.todos=d.todos||[];S.food=typeof d.food==="number"?d.food:2;if(typeof d.name==="string")S.name=d.name;if(typeof d.pet==="string"&&d.pet)S.pet=d.pet;S.xp=typeof d.xp==="number"?d.xp:S.items.filter(function(i){return i.done}).length*10}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncN()}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},3600)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function z(n){return n<10?"0"+n:""+n}
function day(d){d=d||new Date();return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function fmt(ts){return new Date(ts).toLocaleString("id-ID",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function left(ts){var d=ts-Date.now(),a=Math.abs(d),m=Math.round(a/6e4),h=Math.round(a/36e5),dy=Math.round(a/864e5),s=m<60?m+" menit":h<48?h+" jam":dy+" hari";
 return d<0?{t:"terlambat "+s,c:"late"}:{t:s+" lagi",c:d<864e5?"soon":"ok"}}
function nm(){return S.name?", "+S.name:""}

var Q=[["Mulai saja dulu. Sempurna itu urusan belakangan.","🚀"],["Langkah kecil tiap hari lebih kuat daripada semangat sehari penuh.","🐢"],["Capek itu wajar. Istirahat boleh, menyerah jangan.","🌱"],["Deadline itu bukan musuh, cuma teman yang suka ngebut.","⏰"],["Satu tugas selesai hari ini = satu beban hilang besok.","✅"],["Kamu sudah sejauh ini. Tinggal sedikit lagi.","💪"],["Fokus 25 menit dulu, sisanya ngikut.","🍅"],["Tugas yang dikerjakan jelek masih lebih baik daripada yang tidak dikerjakan.","📝"],["Bukan soal siapa paling pintar, tapi siapa yang tetap jalan.","🏃"],["Hari ini berat, tapi kamu lebih kuat dari yang kamu kira.","🌈"]];
var W=["Mantap! Satu tugas beres, makanan Mochi bertambah","Keren, terus pertahankan! 🔥","Kerja bagus! Kamu hebat 💜","Yes! Selangkah lebih dekat ke tujuan 🚀","Gaspol! Tugas berikutnya pasti bisa 💪","Bangga sama usahamu hari ini ⭐"];
function quote(){var q=pick(Q);$("qt").textContent="“"+q[0]+"”";$("qa").textContent="Pengingat untukmu";$("qe").textContent=q[1]}

function streak(){var n=0,d=new Date();if(!S.log[day(d)])d.setDate(d.getDate()-1);while(S.log[day(d)]){n++;d.setDate(d.getDate()-1)}return n}
function burst(){for(var i=0;i<12;i++){var e=document.createElement("div");e.className="pop";e.textContent=pick(["🎉","⭐","✨","💜","🔥"]);
 e.style.left=(20+Math.random()*60)+"vw";e.style.top=(45+Math.random()*25)+"vh";e.style.animationDelay=(Math.random()*.3)+"s";
 document.body.appendChild(e);(function(x){setTimeout(function(){x.remove()},1700)})(e)}}

function row(i,hist){var l=left(i.due),cl=i.done?"done":(l.c==="late"?"late":l.c==="soon"?"soon":""),ontime=i.done&&(i.doneAt||i.due)<=i.due+6e4;
 return '<div class="it '+cl+'"><input type="checkbox" data-c="'+i.id+'"'+(i.done?" checked":"")+' title="'+(i.done?"Batalkan selesai":"Tandai selesai")+'"><div><div class="t">'+esc(i.title)+'</div><div class="m">'+
 (i.course?'<span class="tag">'+esc(i.course)+'</span>':"")+'<span class="tag">'+["","Rendah","Sedang","Tinggi"][i.prio||2]+'</span>'+
 (hist?(i.doneAt?"Selesai "+fmt(i.doneAt)+" · ":"")+'<span class="'+(ontime?"c-ok":"c-soon")+'">'+(ontime?"tepat waktu":"lewat deadline")+'</span>':fmt(i.due)+' · <span class="c-'+l.c+'">'+l.t+'</span>')+'</div>'+
 (i.notes?'<div class="m">'+esc(i.notes)+'</div>':"")+'</div><button class="x" data-d="'+i.id+'" title="Hapus">✕</button></div>'}

var LV=[[0,'Anak Baru'],[30,'Pemula Gigih'],[80,'Pejuang'],[150,'Juara'],[250,'Legenda']];
function lvl(x){var n=0;for(var i=0;i<LV.length;i++)if(x>=LV[i][0])n=i;var nx=LV[n+1];return{n:n+1,name:LV[n][1],from:LV[n][0],next:nx?nx[0]:null}}
function petSvg(n,mood){
 var eyes,mouth,extra='';
 if(mood==='happy'){eyes=`<path d='M42 62q6-9 12 0M66 62q6-9 12 0' stroke='#2b2350' stroke-width='3.5' fill='none' stroke-linecap='round'/>`;mouth=`<path d='M50 74q10 13 20 0z' fill='#2b2350'/>`}
 else if(mood==='sad'){eyes=`<circle cx='48' cy='63' r='4.5' fill='#2b2350'/><circle cx='72' cy='63' r='4.5' fill='#2b2350'/><path d='M41 54l13 4M79 54l-13 4' stroke='#2b2350' stroke-width='3' stroke-linecap='round'/>`;mouth=`<path d='M52 82q8-8 16 0' stroke='#2b2350' stroke-width='3.5' fill='none' stroke-linecap='round'/>`;extra=`<ellipse cx='42' cy='73' rx='2.5' ry='4' fill='#6ec6ff'/>`}
 else{eyes=`<circle cx='48' cy='62' r='4.5' fill='#2b2350'/><circle cx='72' cy='62' r='4.5' fill='#2b2350'/>`;mouth=`<path d='M52 74q8 8 16 0' stroke='#2b2350' stroke-width='3.5' fill='none' stroke-linecap='round'/>`}
 var s=`<svg viewBox='0 0 120 120'><defs><linearGradient id='pgr' x1='0' y1='0' x2='1' y2='1'><stop offset='0' style='stop-color:var(--g1)'/><stop offset='1' style='stop-color:var(--g2)'/></linearGradient></defs><ellipse cx='60' cy='110' rx='30' ry='5' fill='rgba(0,0,0,.12)'/>`;
 if(n>=5)s+=`<circle cx='60' cy='68' r='52' fill='none' stroke='#ffd23f' stroke-opacity='.5' stroke-width='3' stroke-dasharray='4 6'/>`;
 if(n>=2)s+=`<path d='M32 52L36 26L54 42Z M88 52L84 26L66 42Z' fill='url(#pgr)'/><path d='M38 44L40 34L47 41Z M82 44L80 34L73 41Z' fill='#ffc2dd'/>`;
 s+=`<ellipse cx='60' cy='70' rx='35' ry='32' fill='url(#pgr)'/>`;
 if(n<2)s+=`<path d='M27 56Q60 12 93 56L84 50L77 56L68 44L60 56L52 44L43 56L36 50Z' fill='#fff6df' stroke='#e8d9b0' stroke-width='2'/>`;
 s+=`<circle cx='38' cy='73' r='5' fill='#ff9ec7' fill-opacity='.7'/><circle cx='82' cy='73' r='5' fill='#ff9ec7' fill-opacity='.7'/>`+eyes+mouth+extra;
 if(n>=3)s+=`<path d='M30 90Q60 106 90 90L88 99Q60 114 32 99Z' fill='#ff6b6b'/><path d='M78 98l8 14 8-5-6-12z' fill='#ff6b6b'/>`;
 if(n>=4)s+=`<path d='M46 34L50 18L56 28L60 14L64 28L70 18L74 34Z' fill='#ffd23f' stroke='#e0a800' stroke-width='1.5'/>`;
 if(n>=5)s+=`<text x='10' y='30' font-size='16'>✨</text><text x='96' y='40' font-size='14'>✨</text>`;
 return s+'</svg>'}
function petMood(){var now=Date.now(),act=S.items.filter(function(i){return !i.done}),late=act.filter(function(i){return i.due<now}).length;
 if(!S.items.length)return 'empty';if(late)return 'sad';if(!act.length||S.log[day()]>0)return 'happy';return 'normal'}
var petM='',petT='',petSig='';
function petRender(force){
 var m=petMood(),L=lvl(S.xp),n=S.name?', '+S.name:'',p=S.pet||'Mochi';
 var T={empty:['Perutku keroncongan'+n+' 🍎 Tambah tugas pertamamu, tiap tugas selesai jadi makananku!','Aku lagi nunggu makanan nih. Isi tugas dulu yuk, nanti kita makan bareng 🍎'],
  sad:['Aku cemas, ada tugas yang terlambat'+n+' 🥺 Satu aja dulu, yuk!','Pelan-pelan nggak apa-apa. Yang penting mulai 💛','Selesaikan yang paling kecil dulu, aku temenin ya 🫶'],
  happy:['Yeay'+n+'! Aku senang banget hari ini 🥳','Kamu keren! Aku jadi makin semangat ✨','Hari ini kamu rajin banget'+n+'! Jangan lupa kasih aku makan ya 🍎'],
  normal:['Ayo'+n+', selesaikan satu tugas biar aku bisa makan 🍎','Fokus 25 menit dulu, nanti aku kasih semangat 🍅','Kamu pasti bisa. Aku percaya sama kamu 🌟']};
 if(force||m!==petM||!petT){petM=m;petT=pick(T[m])}
 var pv=$('pv'),sig=L.n+m;
 pv.classList.toggle('sad',m==='sad');
 if(sig!==petSig){petSig=sig;pv.innerHTML=petSvg(L.n,m==='empty'?'normal':m)}
 $('pb').textContent=petT;$('pn2').textContent=p;$('pl').textContent='Lv.'+L.n+' '+L.name;
 var pct=L.next?Math.round((S.xp-L.from)/(L.next-L.from)*100):100;
 $('px').style.width=pct+'%';$('pxt').textContent=L.next?S.xp+' / '+L.next+' XP menuju level berikutnya':S.xp+' XP · Level maksimal! 👑';$('fs').textContent='Stok: '+S.food+' 🍎'}
function eatFx(){var r=$('pv').getBoundingClientRect();for(var i=0;i<5;i++){var e=document.createElement('div');e.className='pop';e.textContent=i%2?'😋':'🍎';e.style.left=(r.left+20+Math.random()*80)+'px';e.style.top=(r.top+10+Math.random()*40)+'px';e.style.animationDelay=(i*.1)+'s';document.body.appendChild(e);(function(x){setTimeout(function(){x.remove()},1700)})(e)}}
function feed(){
 if(S.food<1){petM=petMood();petT='Aku lapar... selesaikan tugas atau to-do dulu ya, biar ada yang bisa kumakan 🥺';petRender();toast('Makanannya habis. Selesaikan tugas atau to-do dulu buat dapat makanan 🍎');return}
 var lv0=lvl(S.xp).n;S.food--;S.xp+=10;save();
 petM=petMood();petT=pick(['Nyam nyam! Enak banget'+nm()+' 😋','Makasih sudah kasih aku makan'+nm()+'! 🥰','Hap! Aku kenyang dan makin kuat 💪']);
 petJump();eatFx();petRender();
 if(lvl(S.xp).n>lv0)setTimeout(function(){toast('🎉 '+(S.pet||'Mochi')+' naik ke level '+lvl(S.xp).n+' ('+lvl(S.xp).name+')!')},1200)}
function petJump(){var v=$('pv');v.classList.remove('jump');void v.offsetWidth;v.classList.add('jump')}
function todoRender(){var T=S.todos,d=T.filter(function(t){return t.done}).length,p=T.length?Math.round(d/T.length*100):0;
 $('tdp').style.width=p+'%';
 $('tdt').textContent=T.length?d+' dari '+T.length+' selesai. Tiap centang dapat +1 makanan buat '+(S.pet||'Mochi')+' 🍎':'Masih kosong. Tulis hal kecil pertamamu di atas!';
 $('tdl').innerHTML=T.length?T.map(function(t){return `<div class='td${t.done?' dn':''}'><input type='checkbox' data-t='${t.id}'${t.done?' checked':''}><span>${esc(t.text)}</span><button class='x' data-td='${t.id}' title='Hapus'>✕</button></div>`}).join(''):`<div class='card emp'><b>📝</b>Belum ada to-do. Mulai dari hal kecil, misalnya baca 1 halaman.</div>`}
function tdAdd(){var v=$('tdi').value.trim();if(!v){toast('Tulis dulu to-do-nya ya');return}
 S.todos.unshift({id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:v,done:false});$('tdi').value='';save();render()}
$('tda').onclick=tdAdd;
$('tdi').onkeydown=function(e){if(e.key==='Enter')tdAdd()};
$('tdl').onclick=function(e){var c=e.target.getAttribute('data-t'),d=e.target.getAttribute('data-td');
 if(d){S.todos=S.todos.filter(function(t){return t.id!==d});save();render()}
 if(c){S.todos.forEach(function(t){if(t.id===c){t.done=e.target.checked;
  if(t.done){S.food+=1;t.fg=1;
   toast(pick(['+1 makanan buat '+(S.pet||'Mochi')+' 🍎','Satu langkah kecil beres, mantap'+nm()+'! +1 🍎','Sedikit-sedikit lama-lama jadi bukit ⛰️ +1 🍎']));
   }
  else{S.food=Math.max(0,S.food-(t.fg||0));delete t.fg}}});save();render()}};
$('tdc').onclick=function(){var n=S.todos.filter(function(t){return t.done}).length;if(!n){toast('Belum ada to-do yang selesai');return}
 S.todos=S.todos.filter(function(t){return !t.done});save();render()};
var LN=(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)||null,syncT;
function hid(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h%2000000000)+1}
function syncN(){if(!LN)return;clearTimeout(syncT);syncT=setTimeout(async function(){try{
 var p=await LN.checkPermissions();if(p.display==='prompt'||p.display==='prompt-with-rationale')p=await LN.requestPermissions();if(p.display!=='granted')return;
 var pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications});
 var now=Date.now(),ns=[];S.items.forEach(function(i){if(i.done)return;var at=i.due-(i.remind||0)*6e4;if(at>now)ns.push({id:hid(i.id),title:'Pengingat tugas',body:i.title+' \u00b7 '+fmt(i.due)+'. Semangat!',schedule:{at:new Date(at),allowWhileIdle:true}})});
 if(ns.length)await LN.schedule({notifications:ns})}catch(e){}},600)}
function head(){
 var h=new Date().getHours(),g=h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam",now=Date.now(),
 act=S.items.filter(function(i){return !i.done}).sort(function(a,b){return a.due-b.due}),late=act.filter(function(i){return i.due<now}).length,s;
 if(!S.items.length)s="Tambah tugas pertamamu, lalu kita kerjakan bareng.";
 else if(!act.length)s="Semua tugas beres! Waktunya istirahat, kamu pantas 🎉";
 else if(late)s=late+" tugas sudah lewat deadline. Mulai dari yang paling kecil dulu, ya.";
 else s="Deadline terdekat: "+act[0].title+" ("+left(act[0].due).t+"). Kamu pasti bisa!";
 $("gr").textContent=g+nm()+" 👋";$("gs").textContent=s}

function render(){
 var now=Date.now(),I=S.items,act=I.filter(function(i){return !i.done}).sort(function(a,b){return a.due-b.due}),dn=I.length-act.length,
 pct=I.length?Math.round(dn/I.length*100):0,late=act.filter(function(i){return i.due<now}).length;
 $("s1").textContent=act.length;$("s2").textContent=dn;$("s3").textContent=streak()+"🔥";$("s4").textContent=late;
 $("rp").textContent=pct+"%";$("rg").style.strokeDashoffset=276.46*(1-pct/100);
 $("pt").textContent=I.length?dn+" dari "+I.length+" tugas selesai":"Belum ada tugas. Mulai dari yang kecil!";
 $("ac").textContent=act.length?act.length+" tugas":"";
 $("list").innerHTML=act.length?act.map(function(i){return row(i,false)}).join(""):
  '<div class="card emp"><b>🎯</b>'+(I.length?"Semua tugas beres, mantap!":"Belum ada tugas aktif.")+'<br><button class="p" data-g="tambah">+ Tambah tugas</button></div>';
 var H=I.filter(function(i){return i.done}).sort(function(a,b){return (b.doneAt||b.due)-(a.doneAt||a.due)});
 $("hist").innerHTML=H.length?H.map(function(i){return row(i,true)}).join(""):'<div class="card emp"><b>🌱</b>Belum ada yang selesai. Satu tugas kecil dulu yuk!</div>';
 var d=new Date(),bars=[],mx=1,tot=0,nms=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
 for(var k=6;k>=0;k--){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-k),c=S.log[day(x)]||0;tot+=c;mx=Math.max(mx,c);bars.push([nms[x.getDay()],c])}
 $("wk").innerHTML=bars.map(function(b){return '<div>'+(b[1]?'<b>'+b[1]+'</b>':"")+'<i class="'+(b[1]?"":"z")+'" style="height:'+(b[1]?Math.round(b[1]/mx*80)+10:5)+'px"></i>'+b[0]+'</div>'}).join("");
 $("rs").textContent=tot?tot+" tugas selesai dalam 7 hari terakhir. Pertahankan, "+(S.name||"kamu")+"!":"Belum ada aktivitas minggu ini. Yuk mulai dari satu tugas.";
 todoRender();petRender();head()}

function show(p){page=p;["beranda","tambah","todo","riwayat"].forEach(function(n){$("p-"+n).classList.toggle("on",n===p)});
 [].forEach.call($("nav").children,function(b){b.classList.toggle("on",b.getAttribute("data-g")===p)});
 $("menu").classList.remove("open");document.querySelector(".hero").style.display=p==="beranda"?"":"none";window.scrollTo(0,0)}
function go(p){show(p);try{location.hash=p}catch(e){}}
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(/^(beranda|tambah|todo|riwayat)$/.test(h)&&h!==page)show(h)});
document.addEventListener("click",function(e){var g=e.target.getAttribute&&e.target.getAttribute("data-g");if(g)go(g)});

function dstr(dt){return dt.getFullYear()+"-"+z(dt.getMonth()+1)+"-"+z(dt.getDate())+"T"+z(dt.getHours())+":"+z(dt.getMinutes())}
document.querySelector(".pre").onclick=function(e){var p=e.target.getAttribute("data-p");if(p===null)return;var d=new Date();d.setDate(d.getDate()+ +p);d.setHours(23,59,0,0);$("du").value=dstr(d)};
$("add").onclick=function(){var t=$("ti").value.trim(),d=$("du").value;
 if(!t||!d){toast("Isi judul dan deadline dulu ya");return}
 S.items.push({id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:t,course:$("co").value.trim(),due:new Date(d).getTime(),remind:+$("re").value,prio:+$("pr").value,notes:$("no").value.trim(),done:false,notified:false});
 save();$("ti").value="";$("no").value="";$("du").value="";render();go("beranda");toast("Siap! Pengingat ditambahkan. Kamu pasti bisa 💪")};
function onList(e){var d=e.target.getAttribute("data-d"),c=e.target.getAttribute("data-c");
 if(d){S.items=S.items.filter(function(i){return i.id!==d});save();render()}
 if(c){S.items.forEach(function(i){if(i.id===c){i.done=e.target.checked;
  if(i.done){i.doneAt=Date.now();i.fg=i.doneAt<=i.due?4:3;S.food+=i.fg;S.log[day()]=(S.log[day()]||0)+1;burst();
   var n=S.items.filter(function(x){return !x.done}).length;
   toast((n?pick(W).replace("!",nm()+"!"):"Semua tugas selesai"+nm()+"! Kamu luar biasa 🏆")+" +"+i.fg+" 🍎")}
  else{delete i.doneAt;S.food=Math.max(0,S.food-(i.fg||0));delete i.fg;var k=day();if(S.log[k]>0)S.log[k]--;if(!S.log[k])delete S.log[k]}}});save();render()}}
$("list").onclick=onList;$("hist").onclick=onList;
$("cl").onclick=function(){var n=S.items.filter(function(i){return i.done}).length;if(!n){toast("Riwayat masih kosong");return}
 if(!confirm("Hapus "+n+" tugas selesai dari riwayat?"))return;S.items=S.items.filter(function(i){return !i.done});save();render()};
$("qn").onclick=quote;
$("ns").onclick=function(){S.name=$("nm").value.trim();S.pet=$("pn").value.trim()||"Mochi";save();render();toast(S.name?"Halo, "+S.name+"! Senang bareng kamu 👋":"Nama dihapus")};
$("nt").onclick=function(){if(LN){LN.requestPermissions().then(function(p){toast(p.display==="granted"?"Notifikasi aktif 🔔":"Notifikasi ditolak");syncN()});return}if(!("Notification" in window)){toast("Browser ini belum mendukung notifikasi");return}
 Notification.requestPermission().then(function(p){toast(p==="granted"?"Notifikasi aktif 🔔":"Notifikasi ditolak")})};
$("ls").onclick=function(){var v=$("lu").value.trim();if(v&&!/^https?:\/\//i.test(v))v="https://"+v;S.lms=v;$("lu").value=v;save();toast("Link LMS disimpan")};
$("lo").onclick=function(){if(!S.lms){toast("Isi dan simpan alamat LMS dulu");return}window.open(S.lms,"_blank","noopener")};
$("mn").onclick=function(e){e.stopPropagation();$("menu").classList.toggle("open")};
document.addEventListener("click",function(e){var m=$("menu");if(m.classList.contains("open")&&!m.contains(e.target))m.classList.remove("open")});
$("th").onclick=function(){var r=document.documentElement,d=r.getAttribute("data-theme"),dark=d?d==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.setAttribute("data-theme",dark?"light":"dark")};

function tick(){var now=Date.now(),ch=false;
 S.items.forEach(function(i){if(i.done||i.notified)return;
  if(now>=i.due-(i.remind||0)*6e4){i.notified=true;ch=true;var m=i.title+" · "+fmt(i.due);toast("⏰ "+m+". Semangat!");
   try{if(window.Notification&&Notification.permission==="granted")new Notification("Pengingat tugas",{body:m})}catch(e){}}});
 if(ch)save();render()}

load();$("lu").value=S.lms;$("nm").value=S.name;$("pn").value=S.pet;$("pv").onclick=function(){petRender(true);petJump()};$("fd").onclick=feed;$("pv").addEventListener("animationend",function(e){if(e.animationName==="jump")$("pv").classList.remove("jump")});quote();render();
var h0=location.hash.slice(1);if(/^(beranda|tambah|todo|riwayat)$/.test(h0))show(h0);
tick();setInterval(tick,30000);syncN();
})();
</script>
