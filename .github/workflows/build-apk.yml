name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Mengizinkan Anda memicu proses build secara manual

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil kode dari repository
        uses: actions/checkout@v4

      - name: Menyiapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Menyiapkan Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependensi (NPM)
        run: npm install

      - name: Menyiapkan Platform Android (Capacitor)
        run: |
          npx cap add android || echo "Folder android sudah ada"
          npx cap sync android

      - name: Build file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload hasil APK agar bisa didownload
        uses: actions/upload-artifact@v4
        with:
          name: semangat-tugas-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
